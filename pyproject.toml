[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-change-workbench"
version = "2.0.0"
description = "Evidence-first clinical change review with synthetic replay and measurable validation"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "requests>=2.32,<3",
  "pydantic>=2.9,<3", "sqlalchemy>=2.0,<2.1", "psycopg2-binary>=2.9,<3",
  "python-dotenv>=1,<2", "alembic>=1.13,<2", "cryptography>=44,<50", "openai>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "streamlit>=1.28,<1.54", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["workbench*", "fhir*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
