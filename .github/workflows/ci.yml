name: Workbench checks
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src/workbench tests/test_workbench*.py
      - run: uv run pytest -q
      - run: uv run python scripts/run_workbench.py evaluate --output output/evaluation.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation
          path: output/evaluation.json
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: workbench_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U test -d workbench_test" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.13"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/test_workbench_postgres.py -q
        env:
          WORKBENCH_TEST_POSTGRES_URL: postgresql://test:test@localhost:5432/workbench_test
